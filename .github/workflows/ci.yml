name: Validate and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:models && npm run check:items && npm run check:piles
      - run: npm run check
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: historical-desktop-1
            command: npm run test:e2e -- --project desktop --shard 1/2
          - suite: historical-desktop-2
            command: npm run test:e2e -- --project desktop --shard 2/2
          - suite: historical-mobile-1
            command: npm run test:e2e -- --project mobile --shard 1/2
          - suite: historical-mobile-2
            command: npm run test:e2e -- --project mobile --shard 2/2
          - suite: m25-desktop
            command: npx playwright test --config playwright.m25.config.ts --project m25-desktop
          - suite: m25-landscape
            command: npx playwright test --config playwright.m25.config.ts --project m25-landscape
          - suite: m25-portrait
            command: npx playwright test --config playwright.m25.config.ts --project m25-portrait
          - suite: m25-firefox
            command: npx playwright test --config playwright.m25.config.ts --project m25-firefox
          - suite: m25-webkit
            command: npx playwright test --config playwright.m25.config.ts --project m25-webkit
          - suite: milestones
            command: npx playwright test --config playwright.m31.config.ts && npx playwright test --config playwright.m35.config.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-${{ matrix.suite }}
          path: test-results/
          retention-days: 7
  pages-build:
    needs: [validate, browsers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.pages.config.ts
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist-pages
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
